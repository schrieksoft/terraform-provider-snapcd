repos:
  - repo: local
    hooks:
      - id: make-sync-generate
        name: make sync generate
        entry: make sync generate
        language: system
        pass_filenames: false # setting this to "false" means the hook will only run once per commit, *not* once per file

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint

  # terraform
  # NOTE this repo has other terraform-related hooks that we could consider using
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.74.2
    hooks:
      - id: terraform_fmt
